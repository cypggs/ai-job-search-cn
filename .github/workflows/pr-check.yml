name: PR Validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check all Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
